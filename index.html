<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cố đọc đi — cùng ghép hình nào!</title>
  <style>
    :root {
      --bg-color: #f1fbf9;
      --card-bg: #ffffff;
      --primary: #ff6847;
      --accent: #117864;
      --text-dark: #1e3a3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    .header-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px 28px;
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }
    .badge-tag {
      background: #ffb703;
      color: white;
      font-weight: bold;
      font-size: 13px;
      padding: 10px;
      border-radius: 50%;
      width: 65px;
      height: 65px;
      display: flex;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 20px; color: #1e3a3a; margin-bottom: 4px; }
    .header-text p { font-size: 14px; color: #52796f; }

    .main-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 780px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* START SCREEN */
    .start-screen { width: 100%; max-width: 400px; text-align: center; padding: 20px 0; }
    .puzzle-icon {
      width: 50px; height: 50px; background: #e8f8f5; color: #2ec4b6;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 24px;
    }
    .start-screen h2 { font-size: 22px; margin-bottom: 24px; color: #1f3a44; }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
    .form-group input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #d8e2dc;
      border-radius: 12px; font-size: 15px; outline: none; transition: 0.2s;
    }
    .form-group input:focus { border-color: var(--primary); }
    .btn-start {
      width: 100%; padding: 14px; background: var(--primary);
      border: none; border-radius: 14px; color: white;
      font-size: 20px; cursor: pointer; margin-top: 10px; transition: 0.2s;
    }
    .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }

    /* GAMEPLAY SCREEN */
    .game-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
    .stats-bar {
      display: flex; gap: 14px; width: 100%; max-width: 450px; margin-bottom: 16px;
    }
    .stat-box {
      flex: 1; background: #f8faf9; border: 1px solid #e0eae5;
      border-radius: 12px; padding: 8px 12px; text-align: center;
    }
    .stat-title { font-size: 11px; text-transform: uppercase; color: #7f9c96; font-weight: 700; }
    .stat-val { font-size: 18px; font-weight: bold; color: #222; }

    /* PUZZLE GRID (3 COT x 4 HANG) */
    #puzzle-grid {
      width: 420px; height: 672px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 3px;
      background: #264653;
      padding: 3px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .piece {
      width: 100%; height: 100%;
      background-image: url('cay.jpg');
      background-size: 420px 672px;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.15s, outline 0.15s;
    }
    .piece:hover { opacity: 0.92; }
    .piece.selected {
      outline: 4px solid #ffb703;
      transform: scale(0.96);
      z-index: 10;
    }

    /* LEADERBOARD / RESULT */
    .result-screen { display: none; width: 100%; max-width: 520px; text-align: center; }
    .table-rank { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 15px; }
    .table-rank th, .table-rank td { padding: 10px 14px; text-align: left; }
    .table-rank th { background: #e8f5e9; color: #2e7d32; }
    .table-rank tr:nth-child(even) { background: #fdfdfd; }
    .table-rank tr:hover { background: #f0fdf4; }
    .btn-reset {
      margin-top: 20px; padding: 10px 24px; border-radius: 10px;
      background: #2a9d8f; color: white; border: none; cursor: pointer; font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-card">
    <div class="badge-tag">12 mảnh ghép</div>
    <div class="header-text">
      <h1>Cố đọc đi — cùng ghép hình nào!</h1>
      <p>Quan sát bức tranh, chọn hai mảnh để đổi chỗ và hoàn thành cây 7 Thói Quen.</p>
    </div>
  </div>

  <div class="main-card">
    <!-- MÀN HÌNH 1: NHẬP THÔNG TIN -->
    <div class="start-screen" id="startScreen">
      <div class="puzzle-icon">🧩</div>
      <h2>Sẵn sàng thử tài chưa?</h2>
      <div class="form-group">
        <label>Tên của nhóm / cá nhân</label>
        <input type="text" id="teamName" placeholder="Ví dụ: Nhóm 1 (hoặc Minh Anh)">
      </div>
      <div class="form-group">
        <label>Lớp</label>
        <input type="text" id="className" placeholder="Ví dụ: 4A">
      </div>
      <button class="btn-start" onclick="startGame()">▶ Bắt đầu</button>
    </div>

    <!-- MÀN HÌNH 2: BÀN CHƠI GAME -->
    <div class="game-screen" id="gameScreen">
      <div class="stats-bar">
        <div class="stat-box">
          <div class="stat-title">ĐÚNG VỊ TRÍ</div>
          <div class="stat-val" id="correctCount">0/12</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">LẦN ĐỔI</div>
          <div class="stat-val" id="swapCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">THỜI GIAN</div>
          <div class="stat-val" id="timerVal">00:00</div>
        </div>
      </div>

      <div id="puzzle-grid"></div>
    </div>

    <!-- MÀN HÌNH 3: BẢNG XẾP HẠNG KẾT QUẢ -->
    <div class="result-screen" id="resultScreen">
      <h2>🎉 Chúc mừng bạn đã hoàn thành!</h2>
      <p style="color:#52796f; margin-top: 6px;">Bảng xếp hạng thành tích các nhóm:</p>
      
      <table class="table-rank">
        <thead>
          <tr>
            <th>Hạng</th>
            <th>Tên Nhóm</th>
            <th>Lớp</th>
            <th>Thời gian</th>
            <th>Lần đổi</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>

      <button class="btn-reset" onclick="resetGame()">Chơi lại lượt mới</button>
    </div>
  </div>

<script>
  const COLS = 3;
  const ROWS = 4;
  const TOTAL = COLS * ROWS;
  const PIECE_W = 420 / COLS;
  const PIECE_H = 672 / ROWS;

  const IMG_SRC = 'cay.jpg';

  let currentOrder = [];
  let selectedIdx = null;
  let swaps = 0;
  let timer = null;
  let secondsElapsed = 0;
  let currentTeam = "";
  let currentClass = "";

  function startGame() {
    const teamInput = document.getElementById('teamName').value.trim();
    const classInput = document.getElementById('className').value.trim();
    if (!teamInput) {
      alert("Vui lòng nhập tên nhóm hoặc tên của bạn!");
      return;
    }
    currentTeam = teamInput;
    currentClass = classInput || "---";

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';

    initBoard();
    startTimer();
  }

  function initBoard() {
    swaps = 0;
    document.getElementById('swapCount').innerText = swaps;
    
    currentOrder = Array.from({length: TOTAL}, (_, i) => i);
    do {
      currentOrder.sort(() => Math.random() - 0.5);
    } while (countCorrect() > 2);

    renderGrid();
    updateStatus();
  }

  function renderGrid() {
    const grid = document.getElementById('puzzle-grid');
    grid.innerHTML = '';

    currentOrder.forEach((posIdx, slotIdx) => {
      const piece = document.createElement('div');
      piece.className = 'piece';
      if (selectedIdx === slotIdx) piece.classList.add('selected');

      const originCol = posIdx % COLS;
      const originRow = Math.floor(posIdx / COLS);
      piece.style.backgroundImage = `url('${IMG_SRC}')`;
      piece.style.backgroundPosition = `-${originCol * PIECE_W}px -${originRow * PIECE_H}px`;

      piece.onclick = () => onPieceClick(slotIdx);
      grid.appendChild(piece);
    });
  }

  function onPieceClick(slotIdx) {
    if (selectedIdx === null) {
      selectedIdx = slotIdx;
      renderGrid();
    } else if (selectedIdx === slotIdx) {
      selectedIdx = null;
      renderGrid();
    } else {
      const temp = currentOrder[selectedIdx];
      currentOrder[selectedIdx] = currentOrder[slotIdx];
      currentOrder[slotIdx] = temp;

      swaps++;
      document.getElementById('swapCount').innerText = swaps;
      selectedIdx = null;
      renderGrid();
      updateStatus();

      if (countCorrect() === TOTAL) {
        finishGame();
      }
    }
  }

  function countCorrect() {
    return currentOrder.reduce((acc, curr, idx) => acc + (curr === idx ? 1 : 0), 0);
  }

  function updateStatus() {
    document.getElementById('correctCount').innerText = `${countCorrect()}/${TOTAL}`;
  }

  function startTimer() {
    secondsElapsed = 0;
    clearInterval(timer);
    timer = setInterval(() => {
      secondsElapsed++;
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timerVal').innerText = `${m}:${s}`;
    }, 1000);
  }

  function finishGame() {
    clearInterval(timer);
    setTimeout(() => {
      saveResult();
      showLeaderboard();
    }, 400);
  }

  function saveResult() {
    const results = JSON.parse(localStorage.getItem('puzzle_leaderboard') || '[]');
    results.push({
      name: currentTeam,
      class: currentClass,
      time: secondsElapsed,
      swaps: swaps,
      date: new Date().toLocaleTimeString()
    });
    results.sort((a, b) => a.time - b.time || a.swaps - b.swaps);
    localStorage.setItem('puzzle_leaderboard', JSON.stringify(results));
  }

  function showLeaderboard() {
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';

    const results = JSON.parse(localStorage.getItem('puzzle_leaderboard') || '[]');
    const tbody = document.getElementById('rankBody');
    tbody.innerHTML = '';

    results.forEach((r, idx) => {
      const m = String(Math.floor(r.time / 60)).padStart(2, '0');
      const s = String(r.time % 60).padStart(2, '0');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>#${idx + 1}</strong></td>
        <td>${r.name}</td>
        <td>${r.class}</td>
        <td>${m}:${s}</td>
        <td>${r.swaps} lần</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function resetGame() {
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'block';
  }
</script>
</body>
</html>
